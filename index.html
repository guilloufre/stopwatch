<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catch the Stop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
<style>
  /* Layout: one comic panel holds the time; the STOP button lives loose on the page and runs from the cursor.
     Single deliberate look (a printed comic page), so no dark variant. */
  :root {
    --paper: #f6f1e7;     /* newsprint */
    --dot: #d8e4ee;       /* cyan halftone */
    --ink: #161514;       /* black line */
    --yellow: #ffd23f;    /* caption yellow */
    --red: #e8392f;       /* action red */
    --white: #ffffff;
    --font-display: "Bangers", "Impact", "Arial Black", sans-serif;
    --font-ui: "Comic Neue", "Comic Sans MS", "Trebuchet MS", sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--paper);
    background-image: radial-gradient(var(--dot) 1.6px, transparent 1.7px);
    background-size: 13px 13px;
    color: var(--ink);
    font-family: var(--font-ui);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .caption {
    background: var(--yellow);
    border: 3px solid var(--ink);
    padding: 6px 14px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    transform: rotate(-1.5deg);
    max-width: 100%;
    text-align: center;
  }

  .panel {
    position: relative;
    background: var(--white);
    border: 4px solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
    padding: 18px clamp(18px, 4vw, 40px) 10px;
    max-width: 100%;
  }
  .time {
    display: flex;
    align-items: baseline;
    font-family: var(--font-display);
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .main-time { display: flex; font-size: clamp(84px, 22vw, 200px); }
  .main-time.long { font-size: clamp(62px, 16vw, 150px); }
  .d { display: inline-block; width: 0.5em; text-align: center; }
  .c { display: inline-block; width: 0.24em; text-align: center; }
  .cs { display: flex; font-size: clamp(34px, 8vw, 72px); color: var(--red); margin-left: 0.1em; }
  .cs .d { width: 0.5em; }

  .row { display: flex; align-items: center; gap: 18px; min-height: 84px; }
  .home { width: 150px; height: 70px; }

  .btn {
    font-family: var(--font-display);
    font-size: 30px;
    letter-spacing: 0.06em;
    color: var(--ink);
    border: 4px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    cursor: pointer;
  }
  .btn:focus-visible { outline: 3px dashed var(--red); outline-offset: 5px; }
  .btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }

  #go {
    position: fixed;
    z-index: 5;
    width: 150px;
    height: 70px;
    background: var(--yellow);
    transition: left .22s cubic-bezier(.2, .9, .3, 1.2), top .22s cubic-bezier(.2, .9, .3, 1.2), background-color .15s;
  }
  #go.running { background: var(--red); color: var(--white); }
  #go.whoosh { animation: squash .28s ease-out; }
  @keyframes squash {
    0% { transform: scale(1.25, 0.75) rotate(-6deg); }
    60% { transform: scale(0.92, 1.08) rotate(3deg); }
    100% { transform: none; }
  }

  #reset { background: var(--white); font-size: 22px; padding: 8px 18px; }

  .misses {
    margin: 0;
    min-height: 1.4em;
    font-weight: 700;
    font-size: 16px;
  }
  .misses b { font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--red); letter-spacing: 0.04em; }
  .hint { margin: 0; min-height: 1.3em; font-size: 14px; font-style: italic; }

  /* Speech bubbles */
  .bubble {
    position: fixed;
    z-index: 10;
    pointer-events: none;
    padding: 10px 16px 8px;
    background: var(--white);
    border: 3px solid var(--ink);
    border-radius: 50% / 46%;
    font-family: var(--font-display);
    font-size: 28px;
    letter-spacing: 0.04em;
    white-space: nowrap;
    transform-origin: 18px 100%;
    animation: pop 1.1s ease-out forwards;
  }
  /* tail: a black triangle with a white one inside, pointing down-left at the click */
  .bubble::before, .bubble::after {
    content: "";
    position: absolute;
    left: 14px;
    border-style: solid;
  }
  .bubble::before { bottom: -20px; border-width: 20px 18px 0 0; border-color: var(--ink) transparent transparent transparent; }
  .bubble::after { bottom: -13px; left: 17px; border-width: 14px 12px 0 0; border-color: var(--white) transparent transparent transparent; }
  .bubble.flip { transform-origin: calc(100% - 18px) 100%; }
  .bubble.flip::before { left: auto; right: 14px; border-width: 20px 0 0 18px; }
  .bubble.flip::after { left: auto; right: 17px; border-width: 14px 0 0 12px; }
  .bubble.win { background: var(--yellow); }
  .bubble.win::after { border-top-color: var(--yellow); }
  @keyframes pop {
    0% { transform: scale(0.3) rotate(var(--tilt)); opacity: 0; }
    14% { transform: scale(1.12) rotate(var(--tilt)); opacity: 1; }
    24% { transform: scale(1) rotate(var(--tilt)); }
    75% { opacity: 1; }
    100% { transform: scale(1) translateY(-14px) rotate(var(--tilt)); opacity: 0; }
  }

  @media (max-width: 420px) {
    .home, #go { width: 128px; height: 62px; }
    .btn { font-size: 26px; }
    .bubble { font-size: 23px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #go { transition: none; }
    #go.whoosh { animation: none; }
    .bubble { animation-name: fade; }
    @keyframes fade { 0%, 75% { opacity: 1; transform: rotate(var(--tilt)); } 100% { opacity: 0; transform: rotate(var(--tilt)); } }
  }
</style>
</head>
<body>
  <main>
    <div class="caption" id="caption">Press START. Then just try to stop it.</div>
    <section class="panel">
      <div class="time" role="timer" aria-live="off">
        <div class="main-time" id="mainTime"></div>
        <div class="cs" id="cs"></div>
      </div>
    </section>
    <div class="row">
      <div class="home" id="home" aria-hidden="true"></div>
      <button id="reset" class="btn" hidden>RESET</button>
    </div>
    <p class="misses" id="misses"></p>
    <p class="hint" id="hint"></p>
  </main>

  <button id="go" class="btn">START</button>

<script>
  const $ = id => document.getElementById(id);
  const mainTimeEl = $('mainTime'), csEl = $('cs');
  const go = $('go'), resetBtn = $('reset'), home = $('home');
  const caption = $('caption'), missesEl = $('misses'), hintEl = $('hint');
  const panel = document.querySelector('.panel');

  let running = false, startTime = 0, elapsed = 0, misses = 0, rafId = null;

  const pad = n => String(n).padStart(2, '0');
  const digits = str => [...str].map(ch => ch === ':' ? '<span class="c">:</span>' : `<span class="d">${ch}</span>`).join('');
  const now = () => running ? elapsed + (performance.now() - startTime) : elapsed;

  function render() {
    const totalCs = Math.floor(now() / 10);
    const h = Math.floor(totalCs / 360000), m = Math.floor(totalCs / 6000) % 60, s = Math.floor(totalCs / 100) % 60;
    mainTimeEl.innerHTML = digits((h ? h + ':' : '') + pad(m) + ':' + pad(s));
    mainTimeEl.classList.toggle('long', h > 0);
    csEl.innerHTML = digits(pad(totalCs % 100));
  }
  function tick() { render(); if (running) rafId = requestAnimationFrame(tick); }

  function renderStatus() {
    go.textContent = running ? 'STOP' : (elapsed ? 'GO ON' : 'START');
    go.classList.toggle('running', running);
    resetBtn.hidden = running || elapsed === 0;
    caption.textContent = running ? 'Catch the STOP button!' : (elapsed ? 'Stopped. Sneaky.' : 'Press START. Then just try to stop it.');
    missesEl.innerHTML = misses ? `Missed <b>${misses}</b> ${misses === 1 ? 'time' : 'times'}` : '';
    hintEl.textContent = running && misses >= 5 ? 'Psst… the space bar is faster than any mouse.' : '';
  }

  /* ---------- Button placement ---------- */
  function place(x, y) { go.style.left = x + 'px'; go.style.top = y + 'px'; }
  function goHome() {
    const r = home.getBoundingClientRect();
    place(r.left, r.top);
  }

  // Jump somewhere far from the pointer, never on top of the time panel
  function flee(px, py) {
    const bw = go.offsetWidth, bh = go.offsetHeight;
    const minX = 16, maxX = innerWidth - 16 - bw, minY = 16, maxY = innerHeight - 16 - bh;
    const p = panel.getBoundingClientRect();
    let best = null, bestScore = -1;
    for (let i = 0; i < 30; i++) {
      const x = minX + Math.random() * Math.max(0, maxX - minX);
      const y = minY + Math.random() * Math.max(0, maxY - minY);
      const overPanel = x < p.right + 12 && x + bw > p.left - 12 && y < p.bottom + 12 && y + bh > p.top - 12;
      if (overPanel) continue;
      const d = Math.hypot(x + bw / 2 - px, y + bh / 2 - py);
      // far enough is good; a little randomness keeps it from always picking the same corner
      const score = Math.min(d, 380) + Math.random() * 120;
      if (score > bestScore) { bestScore = score; best = [x, y]; }
    }
    if (!best) best = [minX + Math.random() * (maxX - minX), maxY];
    place(best[0], best[1]);
    go.classList.remove('whoosh');
    void go.offsetWidth;
    go.classList.add('whoosh');
  }

  /* ---------- Bubbles ---------- */
  const TAUNTS = ['You missed!', 'Too slow!', 'Nope!', 'Ha ha!', 'Missed again!', 'Whoosh!', 'Almost!', 'Not even close!', 'Over here!', 'Zoom!'];
  let lastTaunt = '';
  function bubble(x, y, text, win) {
    const b = document.createElement('div');
    b.className = 'bubble' + (win ? ' win' : '');
    b.textContent = text;
    b.style.setProperty('--tilt', (Math.random() * 12 - 6).toFixed(1) + 'deg');
    document.body.appendChild(b);
    const w = b.offsetWidth, h = b.offsetHeight;
    // the tail tip sits on the click point; flip to the other side near the right edge
    let left = x - 14, flip = false;
    if (left + w > innerWidth - 8) { left = x - w + 14; flip = true; }
    left = Math.max(8, left);
    const top = Math.max(8, y - h - 22);
    b.classList.toggle('flip', flip);
    b.style.left = left + 'px';
    b.style.top = top + 'px';
    b.addEventListener('animationend', () => b.remove());
  }
  function miss(x, y) {
    misses++;
    let t;
    do { t = TAUNTS[Math.floor(Math.random() * TAUNTS.length)]; } while (t === lastTaunt);
    lastTaunt = t;
    bubble(x, y, t);
    renderStatus();
  }

  /* ---------- Controls ---------- */
  function start() {
    startTime = performance.now();
    running = true;
    tick();
    renderStatus();
  }
  function stop() {
    elapsed = now();
    running = false;
    cancelAnimationFrame(rafId);
    render();
    renderStatus();
    goHome();
  }
  function reset() {
    if (running) return;
    elapsed = 0; misses = 0;
    render();
    renderStatus();
    goHome();
  }

  function stopFromKeyboard() {
    const r = go.getBoundingClientRect();
    stop();
    bubble(r.left + 20, r.top, 'Sneaky!', true);
  }

  // Every click while running is a miss; the button itself jumps away before it can be pressed
  document.addEventListener('pointerdown', e => {
    if (!running) return;
    if (e.target === go) { e.preventDefault(); flee(e.clientX, e.clientY); }
    miss(e.clientX, e.clientY);
  });

  // Get away as soon as the pointer comes near
  document.addEventListener('pointermove', e => {
    if (!running || e.pointerType === 'touch') return;
    const r = go.getBoundingClientRect();
    const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
    const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    if (Math.hypot(dx, dy) < 60) flee(e.clientX, e.clientY);
  });

  go.addEventListener('click', e => {
    if (!running) return start();
    // keyboard activation (Enter on the focused button) has no pointer, so it is allowed through
    if (e.detail === 0) stopFromKeyboard();
  });
  resetBtn.addEventListener('click', reset);

  document.addEventListener('keydown', e => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'Space') {
      if (e.target.closest('button')) return;   // a focused button handles Space itself, through its click
      e.preventDefault();
      if (running) stopFromKeyboard(); else start();
    } else if (e.code === 'KeyR') reset();
  });

  addEventListener('resize', () => { if (!running) goHome(); else flee(innerWidth / 2, innerHeight / 2); });
  if (document.fonts) document.fonts.ready.then(() => { if (!running) goHome(); });

  render();
  renderStatus();
  goHome();
</script>
</body>
</html>
